[workspace]
members = [
    "crates/core",
    "crates/web",
]
default-members = ["crates/web"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.3"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.100"
i8051 = "0.13.0"
ihex = "3.0.0"
rmp-serde = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"

[patch.crates-io]
i8051 = { path = "vendor/i8051" }

